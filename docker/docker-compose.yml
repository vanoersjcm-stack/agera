name: agera-symphony

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/opt/agera/init.sql:ro
      - ./postgres/00_init_roles.sh:/docker-entrypoint-initdb.d/00_init_roles.sh:ro
      - ../migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/10_V1__initial_schema.sql:ro
      - ../migrations/V2__work_orders_schema.sql:/docker-entrypoint-initdb.d/11_V2__work_orders_schema.sql:ro
      - ../migrations/V3__retailcare_initial_schema.sql:/docker-entrypoint-initdb.d/12_V3__retailcare_initial_schema.sql:ro
      - ../migrations/V4__retailcare_reports_and_media.sql:/docker-entrypoint-initdb.d/13_V4__retailcare_reports_and_media.sql:ro
      - ../migrations/V5__api_keys_and_portal_sync.sql:/docker-entrypoint-initdb.d/14_V5__api_keys_and_portal_sync.sql:ro
      - ../migrations/V6__financials_dsr_nexus.sql:/docker-entrypoint-initdb.d/15_V6__financials_dsr_nexus.sql:ro
      - ./postgres/dev_seed.sql:/docker-entrypoint-initdb.d/20_dev_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    env_file: ../.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-agera.json:/opt/keycloak/data/import/realm-agera.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Placeholder for local voice-to-action processing (open-source Whisper, runs fully on this machine).
  # Not started by default and not yet called by the backend: voice events wait in status 'pending'.
  # Start with: docker compose -f docker/docker-compose.yml --profile voice up -d whisper-local
  whisper-local:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: base
    ports:
      - "127.0.0.1:${WHISPER_PORT:-9000}:9000"
    volumes:
      - whisper_models:/root/.cache

volumes:
  postgres_data:
  whisper_models:
